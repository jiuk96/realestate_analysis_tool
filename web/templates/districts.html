{% extends 'base.html' %}
{% set active_page = 'districts' %}
{% block title %}구별 소개 · 서울 부동산 분석 툴{% endblock %}
{% block content %}
<section class="section" id="secMap">
  <div class="section-inner">
    <div class="section-label">STEP 5 · 구별 소개</div>
    <h2 class="section-title">서울 25개 구, 어떤 동네인가요?</h2>
    <p class="section-desc">
      지도에서 구를 클릭하면 상세 정보를 확인할 수 있습니다.
      <span class="badge-data">● 분석 완료</span> 구는 실거래가 데이터가 적용된 결과입니다.
    </p>

    <!-- 지도 (구 색상 = 평균 부동산 가격대) -->
    <div id="seoulMap" class="map-container" style="margin-bottom:.8rem"></div>
    <div id="mapPriceLegend" class="explorer-legend" style="margin-bottom:2rem"></div>

    <!-- 구 카드 그리드 -->
    <div class="district-card-grid" id="districtCardGrid">
      <div class="skeleton" style="height:200px"></div>
      <div class="skeleton" style="height:200px"></div>
      <div class="skeleton" style="height:200px"></div>
      <div class="skeleton" style="height:200px"></div>
    </div>
  </div>
</section>
{% endblock %}
