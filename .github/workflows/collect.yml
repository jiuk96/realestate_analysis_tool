name: 실거래가 데이터 수집

on:
  workflow_dispatch:        # 수동 실행 (버튼 클릭)
  schedule:
    - cron: '0 1 1 * *'    # 매월 1일 오전 10시 (KST) 자동 실행

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          python src/collector.py
          echo "수집 완료"

      - name: 수집 결과 확인
        run: |
          echo "=== 수집된 파일 목록 ==="
          ls data/raw/*.parquet 2>/dev/null | wc -l
          echo "개 파일 수집됨"
          du -sh data/raw/ 2>/dev/null || echo "데이터 없음"

      - name: 분석 파이프라인 실행 (1차 — 대상 단지 확정)
        run: python build_data.py

      - name: 단지 좌표·최근접역 지오코딩
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          python geocode_apts.py || echo "지오코딩 일부 실패 — 캐시된 결과만 반영"

      - name: 분석 파이프라인 재실행 (2차 — 교통 축 반영)
        run: python build_data.py

      - name: 커밋 서명 설정 (SSH)
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          if [ -z "$SSH_SIGNING_KEY" ]; then
            echo "SSH_SIGNING_KEY 시크릿이 없어 서명 설정을 건너뜁니다."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_SIGNING_KEY" > ~/.ssh/commit_signing_key
          chmod 600 ~/.ssh/commit_signing_key
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/commit_signing_key
          git config commit.gpgsign true

      - name: GitHub에 데이터 커밋·푸시
        env:
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: |
          git config user.name  "github-actions[bot]"
          # 서명이 GitHub에서 "Verified"로 뜨려면 SSH_SIGNING_KEY를 등록한 GitHub 계정의
          # 인증된 이메일이어야 함. GIT_AUTHOR_EMAIL이 없으면 서명은 되지만 미검증으로 남을 수 있음.
          git config user.email "${GIT_AUTHOR_EMAIL:-github-actions[bot]@users.noreply.github.com}"
          git add data/
          if git diff --staged --quiet; then
            echo "변경된 데이터 없음 — 스킵"
          else
            git commit -m "data: 실거래가 수집·분석 $(date +'%Y-%m-%d %H:%M') KST"
            git push
            echo "✅ 푸시 완료"
          fi
