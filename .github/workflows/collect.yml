name: 실거래가 데이터 수집

on:
  workflow_dispatch:        # 수동 실행 (버튼 클릭)
  schedule:
    - cron: '0 1 1 * *'    # 매월 1일 오전 10시 (KST) 자동 실행

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 (매매)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          python src/collector.py
          echo "매매 수집 완료"

      - name: 데이터 수집 (전월세 — 전세가율용)
        timeout-minutes: 60
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python collect_rent.py || echo "전월세 수집 일부 실패 — 전세가율 축은 다음 실행에서 보강"

      - name: 수집 결과 확인
        run: |
          echo "=== 매매 파일 ==="; ls data/raw/*.parquet 2>/dev/null | wc -l
          echo "=== 전월세 파일 ==="; ls data/rent/*.parquet 2>/dev/null | wc -l
          du -sh data/raw/ data/rent/ 2>/dev/null || echo "데이터 없음"

      - name: 분석 파이프라인 실행 (1차 — 대상 단지 확정)
        run: python build_data.py

      - name: 단지 좌표·최근접역 지오코딩
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          python geocode_apts.py || echo "지오코딩 일부 실패 — 캐시된 결과만 반영"

      - name: 학군 프록시(초등학교) 좌표 수집 — OSM
        run: |
          python collect_schools.py || echo "학교 수집 실패 — 캐시된 결과만 반영(학군 축 비활성)"

      - name: 학원 좌표 수집 — 공공데이터포털 상가정보
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          python collect_academies.py || echo "학원 수집 실패 — OSM 학원 데이터로 대체 유지"

      - name: 분석 파이프라인 재실행 (2차 — 교통·직주근접·학군 축 반영)
        run: python build_data.py

      - name: 점수 백테스트 (하락장 예측력 검증)
        run: |
          python backtest_scores.py || echo "백테스트 실패 — 기존 backtest.json 유지"

      - name: AI 추천 매물 순위 산출
        run: |
          python src/ai_ranking.py || echo "AI 순위 산출 실패 — 기존 ai_ranking.json 유지"

      - name: 커밋 서명 설정 (SSH, best-effort)
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: |
          if [ -z "$SSH_SIGNING_KEY" ]; then
            echo "SSH_SIGNING_KEY 시크릿이 없어 서명 설정을 건너뜁니다."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_SIGNING_KEY" > ~/.ssh/commit_signing_key
          chmod 600 ~/.ssh/commit_signing_key

          # 키가 온전한 형식인지 먼저 검증 — 깨진 키로 서명을 켜면 이후 커밋·푸시 단계가
          # 통째로 실패해 수집된 데이터까지 날아가므로, 여기서 실패하면 서명 없이 진행한다.
          if ssh-keygen -y -f ~/.ssh/commit_signing_key > /dev/null 2>&1; then
            git config gpg.format ssh
            git config user.signingkey ~/.ssh/commit_signing_key
            git config commit.gpgsign true
            echo "✅ 커밋 서명 활성화"
          else
            echo "⚠️ SSH_SIGNING_KEY가 유효한 개인키 형식이 아닙니다 — 서명 없이 진행합니다."
            echo "   (Settings → Secrets and variables → Actions에서 값을 다시 확인해주세요)"
            rm -f ~/.ssh/commit_signing_key
          fi

      - name: GitHub에 데이터 커밋·푸시
        env:
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: |
          git config user.name  "github-actions[bot]"
          # 서명이 GitHub에서 "Verified"로 뜨려면 SSH_SIGNING_KEY를 등록한 GitHub 계정의
          # 인증된 이메일이어야 함. GIT_AUTHOR_EMAIL이 없으면 서명은 되지만 미검증으로 남을 수 있음.
          git config user.email "${GIT_AUTHOR_EMAIL:-github-actions[bot]@users.noreply.github.com}"
          git add data/
          if git diff --staged --quiet; then
            echo "변경된 데이터 없음 — 스킵"
          else
            git commit -m "data: 실거래가 수집·분석 $(date +'%Y-%m-%d %H:%M') KST"
            git push
            echo "✅ 푸시 완료"
          fi
