name: Deploy Game to GitHub Pages

on:
  push:
    branches:
      - claude/doodle-jump-game-dev-jvgm8d
    paths:
      - "game/**"
      - ".github/workflows/deploy-game.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-game
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish game/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./game
          commit_message: "deploy: 게임 배포 ${{ github.sha }}"
