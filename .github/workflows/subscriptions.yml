name: 청약 공고 수집 (가벼운 단독 실행)

on:
  workflow_dispatch:        # 수동 실행 (버튼 클릭)
  schedule:
    - cron: '0 22 * * *'   # 매일 오전 7시 (KST) — 새 공고 자동 반영

jobs:
  subscriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치 (requests만)
        run: pip install requests

      - name: 서울 분양(청약) 공고 수집
        env:
          APPLY_HOME_API_KEY: ${{ secrets.APPLY_HOME_API_KEY }}
        run: python collect_subscriptions.py

      - name: 커밋·푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/subscriptions.json
          if git diff --staged --quiet; then
            echo "변경된 공고 없음 — 스킵"
          else
            git commit -m "data: 청약 공고 갱신 $(date +'%Y-%m-%d') KST"
            git push
            echo "✅ 푸시 완료"
          fi
